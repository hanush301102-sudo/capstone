services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: creatorhire
      POSTGRES_USER: creatorhire
      POSTGRES_PASSWORD: creatorhire
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/creatorhire
      DB_USERNAME: creatorhire
      DB_PASSWORD: creatorhire
      JWT_SECRET: change-me-to-a-long-random-secret-for-local-docker-only-0123456789
      FRONTEND_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
