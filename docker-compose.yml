services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: creatorhire
      MYSQL_USER: creatorhire
      MYSQL_PASSWORD: creatorhire
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/creatorhire?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: creatorhire
      DB_PASSWORD: creatorhire
      JWT_SECRET: change-me-to-a-long-random-secret-for-local-docker-only-0123456789
      FRONTEND_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
