server:
  port: 8080

spring:
  application:
    name: creatorhire
  datasource:
    url: jdbc:h2:mem:creatorhire;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Scaffold default only. Override via JWT_SECRET env var (required in prod).
    secret: ${JWT_SECRET:dev-only-secret-key-for-local-development-0123456789}
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
