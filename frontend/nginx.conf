server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the backend service (same Railway private network).
  # The backend service MUST be named "backend" (or edit the host below).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
